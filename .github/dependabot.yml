# Weekly update PRs for Go modules and the pinned GitHub Actions. Minor and
# patch bumps are grouped into one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      gomod:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions:
        update-types: [minor, patch]
